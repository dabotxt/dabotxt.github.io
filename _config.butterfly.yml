# --------------------------------------
# Butterfly Theme Configuration
# 覆盖主题默认配置
# --------------------------------------

# 头像配置
avatar:
  img: https://s1.ax1x.com/2022/04/29/LvbDbT.jpg
  effect: false

# 代码块样式
highlight_theme: darker

# Canvas 背景动画
canvas_nest:
  enable: true
  color: '0,0,255'
  opacity: 0.7
  zIndex: -1
  count: 99
  mobile: false

# 代码块配置
code_blocks:
  theme: light
  macStyle: false
  height_limit: false
  word_wrap: false
  copy: true
  language: true
  shrink: false
  fullpage: false

# 文章元信息
post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: false
    label: true
  post:
    position: left
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true

# 目录配置
toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: false
  scroll_percent: true

# 复制功能
copy:
  enable: true
  copyright:
    enable: false
    limit_count: 150

# 侧边栏配置
aside:
  enable: true
  hide: false
  button: true
  mobile: false
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: 事当决而不决者，愚人也
    button:
      enable: true
      icon: iconfont icon-youxishoubing
      text: Just Relax
      link: https://haiyong.site/moyu/shengchengshu.html
  card_announcement:
    enable: true
    content: |
      <p align="center">微信号：***</p>
      <p align="center">QQ号：***</p>
  card_recent_post:
    enable: true
    limit: 5
    sort: date
    sort_order:
  card_categories:
    enable: true
    limit: 8
    expand: none
    sort_order:
  card_tags:
    enable: true
    limit: 40
    color: true
    orderby: random
    order: 1
    sort_order:
  card_archives:
    enable: true
    type: monthly
    format: MMMM YYYY
    order: -1
    limit: 8
    sort_order:
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    sort_order:
    runtime_date:

# 页脚配置
footer:
  owner:
    enable: true
    since: 2022
  copyright:
    enable: true
    version: true

# 不蒜子统计
busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

# 本地搜索
search:
  use: local_search
  placeholder: 搜索文章...
  algolia_search:
    hitsPerPage: 6
  local_search:
    preload: false
    top_n_per_article: 1
    unescape: false
    CDN:
    pagination:
      enable: false
      hitsPerPage: 8
  docsearch:
    appId:
    apiKey:
    indexName:
    option:

# 分享功能
share:
  use: sharejs
  sharejs:
    sites: facebook,x,wechat,weibo,qq

# 深色模式
darkmode:
  enable: true
  button: true
  autoChangeMode: false

# 图片灯箱
lightbox:

# 懒加载
lazyload:
  enable: false
  native: true

# 锚点
anchor:
  auto_update: false
  click_to_scroll: false

# 图片标题
photofigcaption: false

# 右下角按钮
rightside_scroll_percent: false

# 评论系统
comments:
  use: Giscus
  text: true
  lazyload: false
  count: false
  card_post_count: false

# Giscus 配置
giscus:
  repo: dabotxt/dabotxt.github.io
  repo_id: R_kgDOHLfmJw
  category_id: DIC_kwDOHLfmJ84C1lei
  light_theme: light
  dark_theme: dark
  js:
  option: